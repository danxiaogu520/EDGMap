<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="《归墟之门》1444 年开局国家地图">
  <title>归墟之门 · 世界图志</title>
  <link rel="stylesheet" href="atlas.css?v=setting-reader">
  <script src="atlas.js?v=ruler-gender" type="module"></script>
</head>
<body>
  <main id="map-stage" class="stage" aria-label="国家政治地图">
    <canvas id="map" tabindex="0" aria-label="政治地图。拖动平移，滚轮或双指缩放，点击国家查看档案。键盘可用方向键平移，加减键缩放，回车查看画面中央的国家。"></canvas>
    <div id="load-state" class="load-state" role="status">正在展开地图…</div>
    <div id="map-options" class="map-options" role="group" aria-label="地图设置">
      <button id="mode-toggle" type="button" aria-pressed="false" disabled>仅推荐国</button>
      <button id="language-toggle" type="button" lang="en" aria-label="Switch to English" disabled>EN</button>
    </div>

    <aside id="country-card" class="country-card" aria-label="国家档案" hidden>
      <button id="close-card" type="button" class="game-close close-card" aria-label="关闭国家档案" title="关闭国家档案"></button>
      <div class="card-scroll">
        <header class="country-hero">
          <img id="flag" class="country-shield" alt="" width="92" height="92">
          <h2 id="country-name" class="country-banner"></h2>
          <div class="country-status">
            <div id="government"></div>
            <div id="country-status"></div>
          </div>
        </header>
        <div id="recommendation" class="recommendation">
          <img id="recommendation-icon" alt="" width="18" height="18">
          <span id="recommendation-text"></span>
        </div>
        <dl class="country-facts">
          <div><dt><img src="data/panel/capital.webp" alt=""><span data-i18n="capital">首都</span></dt><dd id="capital"></dd></div>
          <div><dt><img src="data/panel/religion.webp?v=concept" alt=""><span data-i18n="religion">国教</span></dt>
            <dd class="religion-value"><img id="religion-icon" alt="" hidden><span id="religion"></span></dd>
          </div>
          <div><dt><img src="data/panel/culture.webp" alt=""><span data-i18n="culture">主流文化</span></dt><dd id="culture"></dd></div>
        </dl>
        <section class="ruler" aria-labelledby="ruler-title">
          <h3 id="ruler-title" class="dossier-bar dossier-section-heading"><img src="data/panel/ruler.webp" alt=""><span data-i18n="ruler">统治者</span></h3>
          <div id="ruler-missing" class="ruler-missing" data-i18n="unknown" hidden>暂无资料</div>
          <div id="ruler-details" class="ruler-details" hidden>
            <div class="dossier-bar ruler-banner">
              <img id="ruler-gender" class="ruler-gender" alt="" hidden>
              <div id="ruler-name" class="ruler-identity"></div>
            </div>
            <div class="ruler-stats">
              <span id="ruler-adm"><img src="data/panel/adm.webp" alt=""><strong id="adm"></strong></span>
              <span id="ruler-dip"><img src="data/panel/dip.webp" alt=""><strong id="dip"></strong></span>
              <span id="ruler-mil"><img src="data/panel/mil.webp" alt=""><strong id="mil"></strong></span>
              <div id="ruler-age" class="ruler-age"><span data-i18n="age">年龄</span> <strong id="ruler-years"></strong></div>
            </div>
          </div>
        </section>
        <section id="diplomacy" class="diplomacy" aria-labelledby="diplomacy-title" hidden>
          <h3 id="diplomacy-title" class="dossier-bar dossier-section-heading" data-i18n="diplomacy">外交</h3>
          <div id="diplomacy-rows" class="diplomacy-rows"></div>
        </section>
        <section id="country-background" aria-labelledby="background-title" hidden>
          <h3 id="background-title" class="dossier-bar dossier-section-heading" data-i18n="background">背景介绍</h3>
          <div class="background-body">
            <p id="background-text"></p>
            <button id="open-background" type="button" class="game-button" aria-haspopup="dialog" aria-controls="background-dialog" data-i18n="detailedBackground">详细背景</button>
          </div>
        </section>
      </div>
    </aside>
  </main>
  <dialog id="background-dialog" class="background-dialog" aria-labelledby="reader-title">
    <div class="reader-window">
      <header class="dossier-bar reader-header">
        <h2 id="reader-title"></h2>
        <button id="close-background" type="button" class="game-close" aria-label="关闭详细背景" title="关闭详细背景" autofocus></button>
      </header>
      <div id="reader-scroll" class="reader-scroll" tabindex="0" aria-labelledby="reader-title">
        <p id="reader-status" class="reader-status" role="status" hidden></p>
        <article id="background-chapters" class="reader-chapters" lang="zh-CN"></article>
      </div>
    </div>
  </dialog>
</body>
</html>
